server:
  port: ${PORT:8080}

spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5433/booking}
    username: ${BOOKING_DB_USER:seatrush}
    password: ${BOOKING_DB_PASSWORD:seatrush}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints.web.exposure.include: health,info

seatrush:
  demo-show-id: 11111111-1111-1111-1111-111111111111

